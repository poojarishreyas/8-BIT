<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arbok</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231b1b1b'/%3E%3Crect x='11' y='11' width='10' height='10' fill='%23f1ede3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --font:"IBM Plex Mono","Noto Sans Kannada",ui-monospace,Consolas,monospace;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --ok:#3d7a3a;--err:#b3261e;--rec:#b3261e;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme=light]{
  --bg:#f1ede3;--side:#e9e4d7;--panel:#e8e3d6;--input:#f7f4ec;--hover:#e1dbcc;--border:#cfc8b6;--border2:#1b1b1b;
  --text:#1b1b1b;--text2:#3a372f;--muted:#6b6658;--faint:#9a937f;--user:#e8e3d6;--code:#ebe6da;
  --ink:#1b1b1b;--paper:#f7f4ec;--shadow:3px 3px 0 #1b1b1b;--accent:#1b1b1b;--accent-soft:rgba(27,27,27,.08);
}
[data-theme=dark]{
  --bg:#171614;--side:#11100e;--panel:#201e1a;--input:#1c1a17;--hover:#28251f;--border:#3a362e;--border2:#e9e4d6;
  --text:#e9e4d6;--text2:#cbc5b5;--muted:#958f7e;--faint:#6a655a;--user:#221f1b;--code:#121110;
  --ink:#e9e4d6;--paper:#171614;--shadow:3px 3px 0 #000;--accent:#e9e4d6;--accent-soft:rgba(233,228,214,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .25s,color .25s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
textarea:focus-visible,input:focus-visible{outline:none}
.mono{font-family:var(--mono)}
svg{display:block}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#000;color:#fff;font-size:11.5px;padding:5px 8px;border-radius:7px;pointer-events:none;z-index:40;animation:tipin .15s var(--ease) both;font-weight:450}
[data-tip].tip-down:hover::after{bottom:auto;top:calc(100% + 8px)}
@keyframes tipin{from{opacity:0;transform:translateX(-50%) translateY(3px)}}
.layout{display:flex;height:100%}

/* sidebar */
#side{width:260px;flex:none;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:margin .3s var(--ease),background .25s;z-index:5}
.layout.collapsed #side{margin-left:-261px}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.mark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark span{width:11px;height:11px;border-radius:50%;border:2.2px solid #fff}
.icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.icon:hover{background:var(--hover);color:var(--text)}
.icon svg{width:18px;height:18px}
.newchat{margin:4px 12px 10px;height:38px;border-radius:11px;border:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s}
.newchat:hover{background:var(--hover);border-color:var(--border2)}
.newchat svg{width:16px;height:16px;color:var(--accent)}
.newchat kbd{margin-left:auto}
kbd{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:17px;display:inline-block}
.convs{flex:1;overflow-y:auto;padding:4px 8px 10px}
.convs::-webkit-scrollbar,#scroller::-webkit-scrollbar{width:8px}
.convs::-webkit-scrollbar-thumb,#scroller::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.group{font-size:11.5px;color:var(--faint);padding:14px 10px 6px;font-weight:500}
.conv{display:flex;align-items:center;height:34px;border-radius:9px;padding:0 6px 0 10px;font-size:13.5px;color:var(--text2);cursor:pointer;transition:background .12s}
.conv span{flex:1;white-space:nowrap;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.conv:hover{background:var(--hover)}
.conv.active{background:var(--hover);color:var(--text)}
.conv .del{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--faint);opacity:0;transition:opacity .12s}
.conv:hover .del{opacity:1}.conv .del:hover{color:var(--err);background:var(--panel)}
.conv .del svg{width:14px;height:14px}
.conv.enter{animation:slidein .35s var(--ease) both}
@keyframes slidein{from{opacity:0;transform:translateX(-6px)}}
.rems{padding:0 8px 6px}
.rem{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--text2);padding:5px 10px;border-radius:9px;animation:slidein .35s var(--ease) both}
.rem i{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.rem small{display:block;color:var(--faint);font-size:11px}
.side-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:4px}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-right:auto;padding-left:4px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--faint);position:relative}
.sdot.on{background:var(--ok)}
.sdot.on::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--ok);opacity:0;animation:halo 2.4s var(--ease) infinite}
.sdot.off{background:var(--err)}
@keyframes halo{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}

/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 14px}
.topbar .open-side{display:none}
.layout.collapsed .topbar .open-side{display:grid}
.model{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;font-weight:500;font-size:15px}
.model small{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-weight:500}
#scroller{flex:1;overflow-y:auto}
.col{width:100%;max-width:768px;margin:0 auto;padding:0 24px}
#thread{padding:12px 24px 40px}

/* empty */
#empty{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:opacity .35s var(--ease),transform .45s var(--ease)}
#empty .inner{width:100%;max-width:768px;padding:0 24px;margin-top:-190px;text-align:center}
#empty h1{font-size:26px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:12px}
#empty h1 .mark{width:34px;height:34px;border-radius:11px}
#empty h1 .mark span{width:14px;height:14px;border-width:2.6px}
#empty p{color:var(--muted);margin-top:8px;font-size:14.5px}
main:not(.is-empty) #empty{opacity:0;transform:translateY(-12px)}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.sug{font-size:13px;color:var(--text2);border:1px solid var(--border);border-radius:999px;padding:7px 13px;display:flex;gap:7px;align-items:center;transition:background .15s,border-color .15s,transform .15s;opacity:0;animation:fadeup .5s var(--ease) forwards}
.sug:hover{background:var(--hover);border-color:var(--border2)}
.sug:active{transform:scale(.97)}
.sug svg{width:14px;height:14px;color:var(--muted)}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* messages */
.m{margin:22px 0;animation:fadeup .35s var(--ease) both}
.m.user{display:flex;flex-direction:column;align-items:flex-end}
.ub{background:var(--user);padding:10px 16px;border-radius:20px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.m.ai{display:flex;gap:14px}
.m.ai > .mark{width:28px;height:28px;border-radius:9px;margin-top:1px;flex:none;background:transparent;border:1px solid var(--border)}
.m.ai > .mark span{width:11px;height:11px;border-color:var(--accent)}
.m.ai.live > .mark span{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.7);opacity:.55}}
.ab{flex:1;min-width:0;padding-top:3px}
.md{line-height:1.72;overflow-wrap:anywhere}
.md p{margin:0 0 .65em}.md > :last-child{margin-bottom:0}
.md h3,.md h4,.md h5,.md h6{font-weight:600;margin:1em 0 .4em;font-size:1.02em}
.md ul,.md ol{padding-left:1.4em;margin:.2em 0 .75em}.md li{margin:.25em 0;padding-left:.2em}
.md li::marker{color:var(--faint)}
.md a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.md a:hover{border-bottom-color:var(--accent)}
.md strong{font-weight:600}
.md blockquote{border-left:2px solid var(--border2);padding-left:12px;color:var(--text2);margin:.4em 0}
.md :not(pre)>code{font-family:var(--mono);font-size:.86em;background:var(--panel);border:1px solid var(--border);padding:.1em .4em;border-radius:6px}
.codeb{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:.6em 0 .9em;background:var(--code)}
.codeh{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);background:var(--panel)}
.codeh button{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center;padding:3px 7px;border-radius:6px}
.codeh button:hover{color:var(--text);background:var(--hover)}
.codeb pre{padding:13px 15px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.6}
.cursor{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text);margin-left:5px;vertical-align:middle;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.foot{display:flex;align-items:center;gap:2px;margin-top:10px;margin-left:-7px;opacity:0;transition:opacity .2s;min-height:28px}
.m.ai:hover .foot,.m.ai.last .foot{opacity:1}
.foot .icon{width:28px;height:28px;border-radius:8px}
.foot .icon svg{width:15px;height:15px}
.stats{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:8px;display:flex;gap:10px;align-items:center;white-space:nowrap;overflow:hidden}
.stats b{color:var(--muted);font-weight:500}
.lang{font-family:var(--font);font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:0 6px;line-height:18px}
.errbox{border:1px solid rgba(242,92,92,.35);background:rgba(242,92,92,.07);color:var(--text2);border-radius:12px;padding:10px 14px;font-size:13.5px}
.errbox b{color:var(--err);font-weight:600}

/* agent timeline */
.agent{margin:0 0 14px}
.ahead{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);padding:5px 10px 5px 8px;margin-left:-8px;border-radius:9px;transition:background .15s,color .15s;user-select:none}
.ahead:hover{background:var(--hover);color:var(--text2)}
.ahead .chev{width:14px;height:14px;transition:transform .25s var(--ease)}
.agent.closed .ahead .chev{transform:rotate(-90deg)}
.ahead .time{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.agrid{width:14px;height:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.agrid i{border-radius:1px;background:var(--accent);opacity:.25;animation:cell 1.2s ease-in-out infinite}
.agrid i:nth-child(2),.agrid i:nth-child(4){animation-delay:.1s}
.agrid i:nth-child(3),.agrid i:nth-child(5),.agrid i:nth-child(7){animation-delay:.2s}
.agrid i:nth-child(6),.agrid i:nth-child(8){animation-delay:.3s}
.agrid i:nth-child(9){animation-delay:.4s}
@keyframes cell{0%,100%{opacity:.18;transform:scale(.75)}40%{opacity:1;transform:scale(1)}}
.agent.done .agrid{display:none}
.adone{display:none;width:15px;height:15px;color:var(--ok)}
.agent.done .adone{display:block}
.adone path{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .45s .05s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.atext{color:var(--text2)}
.agent:not(.done) .atext,.step.run .t,.step.think .t,.composer.proc .vtxt{background:linear-gradient(90deg,var(--muted) 0%,var(--text) 45%,var(--muted) 90%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2s linear infinite}
.step.run .t b,.step.think .t b{color:inherit}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
.steps{position:relative;margin:6px 0 0 0;display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s var(--ease),opacity .25s,margin .3s}
.steps > div{overflow:hidden;min-height:0;padding-left:29px}
.agent.closed .steps{grid-template-rows:0fr;opacity:0;margin-top:0}
.steps::before{content:"";position:absolute;left:6.5px;top:14px;bottom:18px;width:1px;background:var(--border)}
.step{position:relative;padding:5px 0 10px;animation:fadeup .3s var(--ease) both}
.node{position:absolute;left:-29px;top:9px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border2);display:grid;place-items:center}
.step.run .node{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.step.ok .node{background:var(--accent);border-color:var(--accent)}
.step.ok .node::after{content:"";width:5px;height:2.5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:translate(0,-1px) rotate(-45deg);animation:pop .3s var(--ease) both}
@keyframes pop{from{transform:translate(0,-1px) rotate(-45deg) scale(0)}}
.step.bad .node{background:var(--err);border-color:var(--err)}
.step.think .node{border-style:dashed;border-color:var(--faint);animation:spin 3s linear infinite}
.st{display:flex;align-items:baseline;gap:8px;font-size:13.5px;color:var(--text2)}
.st .t{flex:1;min-width:0}
.st .t b{font-weight:500;color:var(--text)}
.st .ms{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.call{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call .fn{color:var(--accent)}
.res{margin-top:8px;border:1px solid var(--border);border-radius:11px;padding:10px 12px;font-size:13px;color:var(--text2);background:var(--panel);animation:reveal .35s var(--ease) both;transform-origin:top}
@keyframes reveal{from{opacity:0;transform:translateY(-4px) scaleY(.96)}}
.res.err{border-color:rgba(242,92,92,.35);color:var(--err)}
.wx{display:flex;align-items:center;gap:14px}
.wx .tmp{font-size:28px;font-weight:500;letter-spacing:-.03em;color:var(--text);line-height:1}
.wx .tmp sup{font-size:13px;color:var(--muted);vertical-align:top;margin-left:1px}
.wx .d b{color:var(--text);font-weight:500}
.wx .d div{font-size:12px;color:var(--muted);margin-top:2px}
.wk a{display:block;color:var(--text);text-decoration:none;font-weight:500}
.wk a:hover{color:var(--accent)}
.wk p{font-size:12.5px;color:var(--muted);margin:2px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.calc{font-family:var(--mono);font-size:13px}.calc b{color:var(--text);font-weight:500;font-size:15px}
.src{font-size:11px;color:var(--faint);margin-top:6px}

/* composer */
.dock{flex:none;padding:0 0 14px;transition:transform .55s var(--ease)}
.composer{position:relative;background:var(--input);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .3s}
.composer:focus-within{border-color:var(--border2)}
.composer.dictated{animation:landed 1.2s var(--ease)}
@keyframes landed{20%{box-shadow:0 0 0 4px rgba(27,27,27,.28),var(--shadow)}}
textarea{display:block;width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:15.5px;line-height:1.55;padding:15px 18px 4px;max-height:220px;min-height:54px;transition:opacity .2s}
textarea::placeholder{color:var(--faint)}
.crow{display:flex;align-items:center;gap:6px;padding:6px 10px 10px 12px}
.toggle{height:32px;display:flex;align-items:center;gap:6px;padding:0 11px;border-radius:999px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);transition:all .2s}
.toggle svg{width:14px;height:14px}
.toggle:hover{border-color:var(--border2);color:var(--text2)}
.toggle.on{background:var(--accent-soft);border-color:rgba(27,27,27,.35);color:var(--accent)}
.crow .sp{flex:1}
.hintcaps{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:6px;margin-right:6px;transition:opacity .2s}
.btn-mic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.btn-mic:hover{background:var(--hover);color:var(--text)}
.btn-mic svg{width:18px;height:18px}
.btn-send{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;transition:background .2s,transform .15s;position:relative}
.btn-send:disabled{background:var(--border2);color:var(--faint);cursor:default}
.btn-send:not(:disabled):hover{transform:scale(1.05)}
.btn-send:not(:disabled):active{transform:scale(.94)}
.btn-send svg{width:17px;height:17px}
.btn-send.stop{background:var(--text);color:var(--bg)}
.btn-send.stop::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--accent);animation:spin 1s linear infinite}
.disclaim{text-align:center;font-size:11.5px;color:var(--faint);margin-top:9px}
.voice{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:14px;padding:4px 18px 0;opacity:0;pointer-events:none;transition:opacity .2s}
.voice canvas{flex:1;height:32px;min-width:0}
.vlabel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);white-space:nowrap;min-width:104px}
.vlabel .rd{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:recp 1.3s ease-out infinite}
@keyframes recp{0%{box-shadow:0 0 0 0 rgba(242,84,91,.55)}100%{box-shadow:0 0 0 9px rgba(242,84,91,0)}}
.vtime{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.composer.rec,.composer.proc{border-color:rgba(27,27,27,.55)}
.composer.rec{box-shadow:0 0 0 var(--glow,0px) rgba(27,27,27,.16),var(--shadow)}
.composer.rec textarea,.composer.proc textarea{opacity:0}
.composer.rec .voice,.composer.proc .voice{opacity:1}
.composer.proc .vlabel .rd{background:var(--accent);animation:none}
.composer.rec .hintcaps,.composer.proc .hintcaps{opacity:0}
.composer.rec::after{content:"";position:absolute;left:28px;right:28px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scanx 1.4s ease-in-out infinite alternate}
@keyframes scanx{from{transform:scaleX(.2);opacity:.4}to{transform:scaleX(1);opacity:1}}
#toBottom{position:absolute;left:50%;transform:translate(-50%,10px);bottom:150px;width:34px;height:34px;border-radius:50%;background:var(--input);border:1px solid var(--border);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--text2);opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:4}
#toBottom.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#toBottom svg{width:16px;height:16px}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-10px);background:var(--text);color:var(--bg);font-size:12.5px;padding:7px 13px;border-radius:9px;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:90;font-weight:500}
#toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{width:min(460px,92vw);background:var(--bg);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px;transform:scale(.97) translateY(6px);transition:transform .25s var(--ease)}
.modal.on .sheet{transform:none}
.sheet h2{font-size:16px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.row:last-of-type{border-bottom:0}
.row .lbl small{display:block;color:var(--faint);font-size:12px}
.row input[type=text],.row input[type=number]{width:170px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:7px 10px;color:var(--text);font:inherit;font-size:13.5px;outline:0}
.row input:focus{border-color:var(--accent)}
.sw{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--border2);position:relative;cursor:pointer;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw:checked{background:var(--accent)}.sw:checked::after{transform:translateX(14px)}
/* ===================== retro skin ===================== */
*,*::before,*::after{border-radius:0!important}
body{font-size:14.5px;letter-spacing:-.01em}
[data-tip]:hover::after{background:var(--ink);color:var(--paper);font-family:var(--mono)}
.mark{background:var(--ink)}
.mark span{border:0;background:var(--paper);width:9px;height:9px}
#empty h1 .mark span{width:12px;height:12px}
.m.ai > .mark{border:1.5px solid var(--ink);background:transparent}
.m.ai > .mark span{background:var(--ink);width:8px;height:8px}
.brand .bname,.model .bname{text-transform:uppercase;letter-spacing:.14em;font-size:13.5px}
#hello::after{content:"";display:inline-block;width:.5em;height:1em;background:var(--ink);margin-left:6px;vertical-align:-3px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.newchat{border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.newchat:hover{background:var(--paper);border-color:var(--ink)}
.newchat:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.newchat svg{color:var(--ink)}
.conv.active{background:var(--ink);color:var(--paper)}
.conv.active .del{color:var(--paper)}
.sdot.on::after{display:none}
.sdot.on{animation:blink 1.6s steps(1) infinite}
.ub{background:transparent;border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.md a{color:var(--ink);border-bottom:1px solid var(--ink)}
.md li::marker{color:var(--ink)}
.cursor{width:8px;height:15px;background:var(--ink);vertical-align:-3px;animation:blink 1s steps(1) infinite}
.composer{border:1.5px solid var(--ink);box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,border-color .2s}
.composer:focus-within{border-color:var(--ink)}
.composer.dictated{animation:landed .9s steps(3)}
@keyframes landed{0%,100%{box-shadow:var(--shadow)}33%{box-shadow:6px 6px 0 var(--ink)}66%{box-shadow:var(--shadow)}}
.toggle{border:1.5px solid var(--border)}
.toggle.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn-send{background:var(--ink);color:var(--paper)}
.btn-send:disabled{background:transparent;border:1.5px solid var(--border);color:var(--faint)}
.btn-send.stop{background:var(--ink);color:var(--paper)}
.btn-send.stop::before{border:1.5px dashed var(--ink);animation:none;inset:-5px}
.sug{border:1.5px solid var(--border)}
.sug:hover{border-color:var(--ink);background:var(--paper)}
.sugs .sug svg{color:var(--ink)}
.codeb,.res{border:1.5px solid var(--border)}
.call .fn{color:var(--ink);font-weight:600}
.agrid i{background:var(--ink)}
.adone{color:var(--ink)}
.agent:not(.done) .atext,.step.run .t,.step.think .t,.composer.proc .vtxt{background:none!important;-webkit-text-fill-color:currentColor;color:var(--text2);animation:none}
.agent:not(.done) .atext::after,.step.run .t::after,.step.think .t::after,.composer.proc .vtxt::after{content:"_";animation:blink 1s steps(1) infinite;margin-left:1px}
.steps::before{background:none;border-left:1.5px dotted var(--faint);width:0}
.node{border:1.5px solid var(--ink);background:var(--bg);width:12px;height:12px}
.step.run .node{animation:boxblink .5s steps(1) infinite;border-top-color:var(--ink)}
@keyframes boxblink{50%{background:var(--ink)}}
.step.ok .node{background:var(--ink);border-color:var(--ink)}
.step.ok .node::after{border-color:var(--paper)}
.step.think .node{border-style:dashed;border-color:var(--faint);animation:none}
.wx .tmp{font-weight:600}
.lang{border:1.5px solid var(--ink);color:var(--ink)}
.sheet{border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.row input[type=text],.row input[type=number]{border:1.5px solid var(--border)}
.row input:focus{border-color:var(--ink)}
.sw{border:1.5px solid var(--ink);background:transparent}
.sw::after{background:var(--ink);box-shadow:none;top:1.5px;left:1.5px;width:14px;height:14px}
.sw:checked{background:var(--ink)}.sw:checked::after{background:var(--paper)}
#toBottom{border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
#toast{background:var(--ink);color:var(--paper);font-family:var(--mono)}
.composer.rec,.composer.proc{border-color:var(--ink)}
.composer.rec{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.composer.rec::after{left:0;right:0;top:-1.5px;height:1.5px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px);background-size:12px 100%;animation:ants .5s linear infinite;transform:none;opacity:1}
@keyframes ants{to{background-position:12px 0}}
.vlabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.vlabel .rd{background:var(--rec);animation:blink .9s steps(1) infinite;box-shadow:none!important;width:9px;height:9px}
.composer.proc .vlabel .rd{background:var(--ink);animation:boxblink .4s steps(1) infinite}
.vtime{color:var(--ink)}


/* ===================== logo, listening character ===================== */
.logo-orbit{position:relative;width:250px;height:210px;margin:0 auto 6px}
.logo-orbit .char{position:absolute;left:50%;top:8px;height:168px;transform:translateX(-50%);z-index:2;animation:float 5s ease-in-out infinite;filter:drop-shadow(3px 3px 0 rgba(27,27,27,.18))}
@keyframes float{50%{transform:translateX(-50%) translateY(-5px)}}
.logo-orbit .orbit{position:absolute;inset:0;z-index:1;overflow:visible}
.logo-orbit .orbit ellipse{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 5;opacity:.45}
.logo-orbit .el{position:absolute;width:40px;height:40px;left:0;top:0;will-change:transform}
#empty h1{margin-top:2px}
#scroller,#empty,.dock,.topbar,#toBottom{position:relative;z-index:1}
#empty{position:absolute}
#toBottom{position:absolute}
.brand .mark,.m.ai > .mark{background:transparent!important;border:1.5px solid var(--ink)!important;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain;padding:1px}
.brand .mark{width:28px;height:28px}
.m.ai.live > .mark img{animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.vchar{height:26px;width:auto;margin-right:2px;transform-origin:50% 100%}
.composer.rec .vchar{animation:bob .5s steps(2) infinite}
.composer.proc .vchar{animation:none;opacity:.6}
.hintcaps.seen kbd{background:var(--ink);color:var(--paper)}

.meter{display:block;width:180px;height:8px;border:1.5px solid var(--ink);margin-top:7px;position:relative;overflow:hidden}.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);transition:width .08s linear}
.navlink{margin:0 12px 6px;height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;color:var(--text2);text-decoration:none;border:1.5px dashed var(--border)}.navlink:hover{border:1.5px solid var(--ink);color:var(--ink)}.navlink svg{width:15px;height:15px}
@media (max-width:820px){#side{position:absolute;height:100%;box-shadow:var(--shadow)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

function sysPrompt(){
  const now = new Date();
  let p = `You are ${cfg.name}, an AI assistant built for Kannada speakers. Your name is ${cfg.name}. You understand Kannada (ಕನ್ನಡ script), Kanglish (Kannada typed in English letters) and English. Always reply in the same language AND script the user used: if the user writes in ಕನ್ನಡ script, answer only in ಕನ್ನಡ script (never in Kanglish); Kanglish gets Kanglish; English gets English. Be clear, warm and concise: keep answers under 120 words unless the user asks for detail; use markdown lists when helpful.\nToday is ${now.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}, ${now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})} IST, Karnataka, India.`;
  if (!cfg.tools) return p;
  return p + `\n\n# Tools
You can use these tools:
${JSON.stringify(TOOLS)}

To use a tool, reply with ONLY:
<tool_call>{"name": "<tool>", "arguments": {...}}</tool_call>

Rules:
- You DO have these tools. Never say you cannot check live data; call the tool instead.
- Weather, live facts, people/places/history you are unsure about, web pages, date/time and reminders MUST use a tool. Any calculation with numbers (GST, percentages, totals) MUST use the calculator, even if it looks easy.
- When the user asks for a decision based on tool data (e.g. 'if above 30 degrees'), compare the actual numbers and state the conclusion clearly.
- Argument values in English (Mysore = Mysuru, Kalburgi = Kalaburagi). For search_wikipedia use lang "kn" only if the user asks for Kannada Wikipedia.
- After a <tool_response>, either call another tool or write the final answer in the user's language and script. Use only facts from the tool responses; never invent results.
- Greetings and general chat get a normal answer without tools.

Examples:
User: Bengaluru alli male barutta?
Assistant: <tool_call>{"name": "get_weather", "arguments": {"city": "Bengaluru"}}</tool_call>
User: ಕುವೆಂಪು ಯಾರು?
Assistant: <tool_call>{"name": "search_wikipedia", "arguments": {"query": "Kuvempu", "lang": "en"}}</tool_call>
User: 23% of 4500?
Assistant: <tool_call>{"name": "calculator", "arguments": {"expression": "4500*23%"}}</tool_call>
User: Sanje 6 ge milk tagolakke nenapisu
Assistant: <tool_call>{"name": "set_reminder", "arguments": {"text": "Buy milk", "time": "today 18:00"}}</tool_call>
User: ನಮಸ್ಕಾರ!
Assistant: ನಮಸ್ಕಾರ! ಹೇಳಿ, ಏನು ಸಹಾಯ ಬೇಕು?`;
}
async function runTool(name, args){
  const t0 = performance.now();
  try {
    if (name === "set_reminder"){
      const r = {text:String(args.text || "Reminder"), time:String(args.time || ""), at:Date.now()};
      reminders.unshift(r); reminders = reminders.slice(0, 5); store.set("arbok_rem", reminders); renderReminders();
      await sleep(350);
      return {ok:true, result:{saved:true, text:r.text, time:r.time}, ms:performance.now() - t0};
    }
    if (name === "get_datetime"){
      await sleep(250);
      return {ok:true, result:{local:new Date().toLocaleString("en-IN",{dateStyle:"full", timeStyle:"short"}), timezone:"Asia/Kolkata"}, ms:performance.now() - t0};
    }
    const r = await fetch("/api/tool", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name, args})});
    const j = await r.json(); j.ms = performance.now() - t0; return j;
  } catch(e){ return {ok:false, error:String(e.message || e), ms:performance.now() - t0}; }
}
function toolTitle(name, a, running){
  const v = x => `<b>${esc(String(x ?? "").slice(0, 60))}</b>`;
  switch (name){
    case "get_weather": return (running ? "Checking the weather in " : "Checked the weather in ") + v(a.city);
    case "search_wikipedia": return (running ? "Searching Wikipedia for " : "Searched Wikipedia for ") + v(a.query);
    case "fetch_page": { let h = a.url; try { h = new URL(a.url).hostname; } catch(e){} return (running ? "Reading " : "Read ") + v(h); }
    case "calculator": return (running ? "Calculating " : "Calculated ") + v(a.expression);
    case "get_datetime": return running ? "Checking the date and time" : "Checked the date and time";
    case "set_reminder": return (running ? "Setting a reminder: " : "Reminder set: ") + v(a.text);
    default: return (running ? "Calling " : "Called ") + v(name);
  }
}
function toolResultHTML(name, j){
  if (!j.ok || (j.result && j.result.error)) return `<div class="res err">${esc(j.error || j.result.error)}</div>`;
  const r = j.result;
  if (name === "get_weather") return `<div class="res"><div class="wx"><div class="tmp">${Math.round(r.temp_c)}<sup>°C</sup></div><div class="d"><b>${esc(r.city)}</b>${r.region ? ", " + esc(r.region) : ""} · ${esc(r.condition)}<div>Feels ${Math.round(r.feels_like_c)}° · H ${Math.round(r.today_max_c)}° L ${Math.round(r.today_min_c)}° · Humidity ${r.humidity_pct}% · Rain ${r.rain_chance_pct ?? 0}%</div></div></div><div class="src">Open-Meteo · live</div></div>`;
  if (name === "search_wikipedia") return `<div class="res wk">${(r.results || []).slice(0, 2).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><p>${esc(x.summary)}</p>`).join("") || "No results"}<div class="src">${r.lang === "kn" ? "ಕನ್ನಡ ವಿಕಿಪೀಡಿಯ" : "Wikipedia"}</div></div>`;
  if (name === "calculator") return `<div class="res calc">${esc(r.expression)} = <b>${esc(Number(r.result).toLocaleString("en-IN"))}</b></div>`;
  if (name === "fetch_page") return `<div class="res"><b style="color:var(--text);font-weight:500">${esc(r.title || r.url)}</b><div class="src">${(r.chars || 0).toLocaleString()} characters read</div></div>`;
  if (name === "set_reminder") return `<div class="res">${esc(r.text)}${r.time ? ` · <span style="color:var(--muted)">${esc(r.time)}</span>` : ""}<div class="src">Saved to the sidebar</div></div>`;
  if (name === "get_datetime") return `<div class="res">${esc(r.local)}</div>`;
  return `<div class="res mono" style="font-size:12px">${esc(JSON.stringify(r).slice(0, 300))}</div>`;
}
function parseCalls(text){
  const calls = [], re = /<tool_call>\s*([\s\S]*?)\s*<\/tool_call>/g; let m;
  while ((m = re.exec(text))){ try { const j = JSON.parse(m[1]); if (j.name) calls.push({name:j.name, args:j.arguments || j.args || {}}); } catch(e){} }
  if (!calls.length){ const s = text.trim(); if (s.startsWith('{"name"')){ try { const j = JSON.parse(s); calls.push({name:j.name, args:j.arguments || {}}); } catch(e){} } }
  return calls;
}

/* ================= markdown ================= */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function inl(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdBlock(t){
  let h = "", list = null, para = [];
  const flushP = () => { if (para.length){ h += `<p>${para.map(inl).join("<br>")}</p>`; para = []; } };
  const closeL = () => { if (list){ h += `</${list}>`; list = null; } };
  for (const raw of t.split("\n")){
    const l = raw.replace(/\s+$/, ""); let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))){ flushP(); closeL(); const n = m[1].length + 2; h += `<h${n}>${inl(m[2])}</h${n}>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))){ flushP(); if (list !== "ul"){ closeL(); h += "<ul>"; list = "ul"; } h += `<li>${inl(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ flushP(); if (list !== "ol"){ closeL(); h += "<ol>"; list = "ol"; } h += `<li>${inl(m[1])}</li>`; }
    else if ((m = l.match(/^>\s?(.*)/))){ flushP(); closeL(); h += `<blockquote>${inl(m[1])}</blockquote>`; }
    else if (!l.trim()){ flushP(); closeL(); }
    else { closeL(); para.push(l); }
  }
  flushP(); closeL(); return h;
}
function md(src){
  return src.split("```").map((p, i) => {
    if (!(i % 2)) return mdBlock(p);
    const nl = p.indexOf("\n"), lang = nl > 0 ? p.slice(0, nl).trim() : "", code = nl > 0 ? p.slice(nl + 1) : p;
    return `<div class="codeb"><div class="codeh"><span>${esc(lang || "code")}</span><button class="cpcode">${IC.copy.replace("<svg", '<svg style="width:13px;height:13px"')}Copy</button></div><pre>${esc(code.replace(/\n$/, ""))}</pre></div>`;
  }).join("");
}
const KANG = /\b(enu|yenu|illi|alli|ide|illa|beku|beda|maadi|madi|naanu|nanu|neevu|ninu|nimma|nanna|hegide|hege|yaake|gottu|swalpa|banni|houdu|sari|andre|aagi|kodi|ondu|thumba|tumba|chennagi|ella|anta|aadre|mattu|eshtu)\b/gi;
function langOf(s){
  const kn = (s.match(/[ಀ-೿]/g) || []).length, all = (s.match(/[A-Za-zಀ-೿]/g) || []).length || 1;
  if (kn / all > .3) return "ಕನ್ನಡ";
  const words = s.toLowerCase().match(/[a-z]+/g) || [];
  const suf = words.filter(w => w.length > 4 && /(alli|inda|utte|uttade|ide|odu|aagi|ige|ante|aaga|agide|ondu|ella|gala|galu|alla|beku|kodi|maadi)$/.test(w)).length;
  return ((s.match(KANG) || []).length + suf) >= 2 && (suf + (s.match(KANG) || []).length) / Math.max(1, words.length) > .08 ? "Kanglish" : "English";
}

/* ================= conversations ================= */
function save(){ store.set("arbok_convs", convs.slice(0, 60)); }
function newConv(){ return {id:"c" + Date.now().toString(36), title:"New chat", ts:Date.now(), api:[], ui:[]}; }
function group(ts){
  const today = new Date(); today.setHours(0,0,0,0);
  if (ts >= today.getTime()) return "Today";
  const d = (today.getTime() - ts) / 864e5;
  if (d < 1) return "Yesterday"; if (d < 7) return "Previous 7 days"; return "Older";
}
function renderConvs(animateId){
  let h = "", g = null;
  convs.filter(c => c.ui.length).sort((a, b) => b.ts - a.ts).forEach(c => {
    const gg = group(c.ts); if (gg !== g){ h += `<div class="group">${gg}</div>`; g = gg; }
    h += `<div class="conv${cur && c.id === cur.id ? " active" : ""}${c.id === animateId ? " enter" : ""}" data-id="${c.id}"><span>${esc(c.title)}</span><button class="del" data-del="${c.id}" aria-label="Delete">${IC.trash}</button></div>`;
  });
  $("#convs").innerHTML = h;
}
$("#convs").addEventListener("click", e => {
  const d = e.target.closest("[data-del]");
  if (d){ e.stopPropagation(); convs = convs.filter(c => c.id !== d.dataset.del); save(); if (cur && cur.id === d.dataset.del) openConv(null); else renderConvs(); toast("Chat deleted"); return; }
  const c = e.target.closest(".conv"); if (c && !busy) openConv(convs.find(x => x.id === c.dataset.id));
});
function renderReminders(){
  $("#rems").innerHTML = reminders.length ? `<div class="group">Reminders</div>` + reminders.slice(0, 3).map(r => `<div class="rem"><i></i><div>${esc(r.text)}<small>${esc(r.time || "")}</small></div></div>`).join("") : "";
}
function openConv(c){
  if (busy) stop();
  cur = c; $("#thread").innerHTML = "";
  if (!c){ setEmpty(true); renderConvs(); ta.focus(); return; }
  setEmpty(false);
  c.ui.forEach((it, i) => it.role === "user" ? addUser(it.text, true) : addAIStatic(it, i === c.ui.length - 1));
  renderConvs(); scrollBottom(true); ta.focus();
}

/* ================= streaming + agent loop ================= */
class Reveal{
  constructor(el){ this.el = el; this.target = ""; this.shown = 0; this.on = true; this.final = false; this._res = null; this.tick = this.tick.bind(this); requestAnimationFrame(this.tick); }
  set(t){ this.target = t; }
  tick(){
    if (!this.on) return;
    const n = this.target.length;
    if (this.shown < n){ this.shown += Math.max(1, Math.ceil((n - this.shown) / 6)); this.paint(); }
    else if (this.final){ this.on = false; this.el.innerHTML = md(this.target); scrollBottom(); if (this._res) this._res(); return; }
    requestAnimationFrame(this.tick);
  }
  paint(){
    let h = md(this.target.slice(0, this.shown));
    const k = h.search(/<\/(p|li|h\d|blockquote)>(?![\s\S]*<\/(p|li|h\d|blockquote)>)/);
    h = k >= 0 ? h.slice(0, k) + '<span class="cursor"></span>' + h.slice(k) : h + '<span class="cursor"></span>';
    this.el.innerHTML = h; scrollBottom();
  }
  finish(){ this.final = true; return new Promise(r => { this._res = r; if (!this.on) r(); }); }
  kill(){ this.on = false; }
}
function stripThink(raw){
  let s = raw; const o = s.indexOf("<think>");
  if (o !== -1){ const c = s.indexOf("</think>", o); s = c === -1 ? s.slice(0, o) : s.slice(0, o) + s.slice(c + 8); }
  return s.replace(/^\s+/, "");
}
function mode(ans){
  const s = ans.trimStart(), T = "<tool_call>";
  if (!s) return "wait";
  if (s.startsWith(T) || s.startsWith('{"name"')) return "tool";
  if (T.startsWith(s) || '{"name"'.startsWith(s)) return "wait";
  return "text";
}
async function streamOnce(messages, onText, signal){
  const out = {raw:"", usage:null, t0:performance.now(), tFirst:0, chunks:0};
  const res = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, signal,
    body:JSON.stringify({messages, stream:true, stream_options:{include_usage:true}, temperature:+cfg.temperature, max_tokens:600})});
  if (!res.ok){ let m = res.statusText; try { m = (await res.json()).error || m; } catch(e){} throw new Error(`${res.status} · ${m}`); }
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;){
    const {value, done} = await rd.read(); if (done) break;
    buf += dec.decode(value, {stream:true}); let i;
    while ((i = buf.indexOf("\n")) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      const d = line.slice(5).trim(); if (d === "[DONE]") continue;
      let j; try { j = JSON.parse(d); } catch(e){ continue; }
      if (j.usage) out.usage = j.usage;
      const c = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
      if (c){ if (!out.tFirst) out.tFirst = performance.now(); out.chunks++; out.raw += c; onText(out.raw); }
    }
  }
  out.t1 = performance.now(); return out;
}
async function send(text){
  text = (text ?? ta.value).trim();
  if (!text || busy) return;
  ta.value = ""; grow(); updateSend();
  if (!cur){ cur = newConv(); convs.unshift(cur); }
  if (!cur.ui.length) cur.title = text.length > 42 ? text.slice(0, 42) + "…" : text;
  cur.ts = Date.now();
  setEmpty(false);
  addUser(text); cur.ui.push({role:"user", text}); cur.api.push({role:"user", content:text});
  renderConvs(cur.ui.length === 1 ? cur.id : null); save(); scrollBottom(true);
  await agentTurn();
}
async function agentTurn(){
  const el = aiShell(), mdEl = el.querySelector(".md"), ag = el.querySelector(".agent"), box = ag.querySelector(".steps > div");
  el.classList.add("live"); busy = true; setBusy(); abortCtl = new AbortController();
  mdEl.innerHTML = '<span class="cursor" style="margin-left:0"></span>';
  const item = {role:"ai", text:"", steps:[], stats:null};
  const tStart = performance.now(); let timer = null, tokens = 0, genTime = 0, rv = null;
  const head = t => ag.querySelector(".atext").textContent = t;
  const openAgent = () => { if (!ag.hidden) return; ag.hidden = false; timer = setInterval(() => ag.querySelector(".time").textContent = ((performance.now() - tStart)/1000).toFixed(1) + "s", 100); };
  try {
    for (let iter = 0; iter < 5; iter++){
      let decided = null; rv = null;
      let think = null;
      if (iter > 0){ head("Reading the results"); think = document.createElement("div"); think.className = "step think"; think.innerHTML = '<span class="node"></span><div class="st"><span class="t">Reading the results</span></div>'; box.appendChild(think); scrollBottom(); }
      const routed = (iter === 0 && cfg.tools) ? preRoute(cur.api[cur.api.length - 1].content) : null;
      const r = routed ? {raw:`<tool_call>${JSON.stringify({name:routed.name, arguments:routed.args})}</tool_call>`, usage:{completion_tokens:0}, chunks:0, t0:performance.now(), tFirst:performance.now(), t1:performance.now()}
      : await streamOnce([{role:"system", content:sysPrompt()}, ...cur.api.slice(-24)], raw => {
        const ans = stripThink(raw);
        if (!decided){ const m = mode(ans); if (m !== "wait") decided = m; }
        if (decided === "text"){
          if (think){ think.remove(); think = null; head("Writing the answer"); }
          if (!rv) rv = new Reveal(mdEl);
          rv.set(ans.split("<tool_call>")[0]);
        }
      }, abortCtl.signal);
      if (think) think.remove();
      const ans = stripThink(r.raw);
      tokens += (r.usage && r.usage.completion_tokens) || r.chunks;
      genTime += (r.t1 - (r.tFirst || r.t0)) / 1000;
      const calls = cfg.tools ? parseCalls(ans) : [];
      if (calls.length && iter < 4){
        if (rv){ rv.kill(); rv = null; }
        mdEl.innerHTML = "";
        openAgent();
        cur.api.push({role:"assistant", content:ans});
        let responses = "";
        for (const c of calls){
          const s = {name:c.name, args:c.args, status:"run"};
          head(({get_weather:"Checking the weather", search_wikipedia:"Searching Wikipedia", fetch_page:"Reading the page", calculator:"Calculating", get_datetime:"Checking the time", set_reminder:"Setting a reminder"})[c.name] || "Working");
          const w = document.createElement("div"); w.innerHTML = stepHTML(s); const stepEl = w.firstChild; box.appendChild(stepEl); scrollBottom();
          const res = await runTool(c.name, c.args);
          if (abortCtl.signal.aborted) throw new DOMException("stopped", "AbortError");
          s.status = res.ok && !(res.result && res.result.error) ? "ok" : "bad"; s.ms = res.ms; s.res = res;
          const w2 = document.createElement("div"); w2.innerHTML = stepHTML(s); const done = w2.firstChild; done.style.animation = "none";
          stepEl.replaceWith(done); item.steps.push(s); scrollBottom();
          let txt = JSON.stringify(res.ok ? res.result : {error:res.error}); if (txt.length > 3500) txt = txt.slice(0, 3500) + "…";
          responses += `<tool_response>{"name": "${c.name}", "result": ${txt}}</tool_response>\n`;
        }
        cur.api.push({role:"user", content:responses.trim()});
        continue;
      }
      const finalText = ans.replace(/<tool_call>[\s\S]*?(<\/tool_call>|$)/g, "").trim();
      if (!rv) rv = new Reveal(mdEl);
      rv.set(finalText); await rv.finish();
      item.text = finalText; cur.api.push({role:"assistant", content:finalText});
      break;
    }
  } catch(e){
    if (rv) rv.kill();
    if (e.name === "AbortError"){
      const partial = rv ? rv.target : "";
      item.text = partial; mdEl.innerHTML = partial ? md(partial) : `<p style="color:var(--muted)">Stopped.</p>`;
      if (partial) cur.api.push({role:"assistant", content:partial});
    } else {
      item.err = e.message || String(e);
      mdEl.innerHTML = `<div class="errbox"><b>Couldn't reach the model.</b> ${esc(item.err)}</div>`;
    }
  }
  clearInterval(timer);
  const secs = (performance.now() - tStart) / 1000;
  if (!ag.hidden){
    ag.classList.add("done");
    head(`Used ${item.steps.length} tool${item.steps.length > 1 ? "s" : ""}`);
    ag.querySelector(".time").textContent = secs.toFixed(1) + "s"; item.secs = secs;
  }
  if (tokens && item.text) item.stats = {tokens, rate:tokens / Math.max(.001, genTime), cpt:item.text.length / Math.max(1, tokens)};
  el.querySelector(".foot").innerHTML = footHTML(item.stats, item.text || "");
  el.classList.remove("live");
  cur.ui.push(item); save(); renderConvs();
  busy = false; setBusy(); scrollBottom();
}
/* harness router: numbers go to the calculator before the model can guess */
function preRoute(text){
  const t = text.replace(/₹|rs\.?|rupees?/gi, "").replace(/(\d),(\d)/g, "$1$2");
  let m = t.match(/(\d+(?:\.\d+)?)\s*%\s*(?:gst\s*)?(?:of|on|in|mele|ge)?\s*(?:gst\s*)?(?:of|on)?\s*(\d+(?:\.\d+)?)/i);
  if (m) return {name:"calculator", args:{expression:`${m[2]}*${m[1]}%`}};
  m = t.match(/(\d+(?:\.\d+)?(?:\s*[-+*/x×÷^]\s*\d+(?:\.\d+)?)+)/);
  if (m && /[-+*/x×÷^]/.test(m[1]) && !/\d{4}\s*-\s*\d{2}/.test(m[1])) return {name:"calculator", args:{expression:m[1].replace(/x/g, "*")}};
  return null;
}
function stop(){ if (abortCtl) abortCtl.abort(); }
function regenerate(){
  if (!cur) return;
  let i = cur.api.length - 1;
  while (i >= 0 && !(cur.api[i].role === "user" && !cur.api[i].content.startsWith("<tool_response>"))) i--;
  if (i < 0) return;
  cur.api = cur.api.slice(0, i + 1); cur.ui.pop(); save();
  const last = [...thread.querySelectorAll(".m.ai")].pop(); if (last) last.remove();
  agentTurn();
}

function buildOrbit(box, opts){
  const W = opts.w, H = opts.h;
  box.innerHTML = `<svg class="orbit" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><ellipse cx="${W/2}" cy="${opts.cy}" rx="${opts.rx}" ry="${opts.ry}" transform="rotate(${opts.tilt} ${W/2} ${opts.cy})"/></svg><img class="char" src="${LOGO.char}" alt="">` +
    ["fire","water","air","leaf"].map(k => `<img class="el" src="${LOGO[k]}" alt="">`).join("");
  return {box, els:[...box.querySelectorAll(".el")], ...opts};
}
function placeOrbit(o, t){
  const r = o.box.getBoundingClientRect(); if (!r.width) return;
  const sx = r.width / o.w, sy = r.height / o.h, cx = r.width/2, cy = o.cy*sy, rx = o.rx*sx, ry = o.ry*sy;
  const tl = o.tilt * Math.PI/180, ct = Math.cos(tl), st = Math.sin(tl);
  o.els.forEach((el, i) => {
    const a = t*o.speed + i*Math.PI/2;
    const ex = Math.cos(a)*rx, ey = Math.sin(a)*ry;
    const x = cx + ex*ct - ey*st, y = cy + ex*st + ey*ct;
    const depth = (Math.sin(a) + 1)/2;                      // 1 = in front of the character
    const sc = .72 + .28*depth, w = el.offsetWidth || 40;
    el.style.transform = `translate(${x - w/2}px,${y - w/2}px) scale(${sc})`;
    el.style.zIndex = depth > .5 ? 3 : 1;
    if (!o.fade) el.style.opacity = (.55 + .45*depth).toFixed(2);
  });
}
const heroOrbit = buildOrbit(document.getElementById("heroLogo"), {w:250, h:210, cy:118, rx:118, ry:30, tilt:-14, speed:.75});
(function orbitLoop(ms){
  const t = ms/1000;
  if (main.classList.contains("is-empty")) placeOrbit(heroOrbit, t);
  requestAnimationFrame(orbitLoop);
})(0);

/* ================= boot ================= */
dock.style.transition = "none";
applyTheme(); applyBrand(); syncToggles(); renderReminders(); renderConvs(); setBusy(); setEmpty(true);
requestAnimationFrame(() => requestAnimationFrame(() => dock.style.transition = ""));
ping(); setInterval(ping, 15000);
ta.focus();
</script>
